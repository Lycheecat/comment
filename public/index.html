<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
    <title>Comments</title>

</head>

<body>
    <div class="wrap">
        <h1>Comments</h1>
        <table>
            <tbody id="commentBody">
                <tr class="empty">
                    <td>No comments yet</td>
                </tr>
            </tbody>
        </table>
        <form id="commentForm">
            <input type="text" id="commentInput" placeholder="Write a comment" autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>

</html>
